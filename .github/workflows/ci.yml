name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Pick a simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available --json \
            | python3 -c "import sys, json; ds=json.load(sys.stdin)['devices']; \
              cands=[d for rt in sorted(ds) if 'iOS' in rt for d in ds[rt] if d.get('isAvailable') and 'iPhone' in d['name']]; \
              print(cands[-1]['udid'] if cands else '')")
          if [ -z "$UDID" ]; then echo "No iOS simulator available" >&2; exit 1; fi
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Test
        run: xcodebuild test -scheme TextSearchKit -destination "id=${{ steps.sim.outputs.udid }}"

      # The package ships a Swift 5.9 floor (broad consumer compatibility), but the
      # code is written to be clean under Swift 6's strict concurrency checking.
      # This compiles the library and tests in Swift 6 language mode so any future
      # concurrency regression fails here as a hard error — without raising the floor.
      - name: Compile under Swift 6 language mode
        run: xcodebuild build-for-testing -scheme TextSearchKit -destination "id=${{ steps.sim.outputs.udid }}" SWIFT_VERSION=6
