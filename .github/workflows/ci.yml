name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Show destinations
        run: xcodebuild -scheme TextSearchKit -showdestinations

      - name: Test
        run: xcodebuild test -scheme TextSearchKit -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest'
